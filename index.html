<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مصاريفي"><link rel="manifest" href="./manifest.webmanifest">
<title>مصاريفي</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Arabic",Tahoma,sans-serif;color:#19243a;background:#f5f6fa}*{box-sizing:border-box}body{margin:0}.app{max-width:620px;margin:auto;padding:24px 18px calc(32px + env(safe-area-inset-bottom))}.eyebrow{color:#8791a2;font-size:13px;font-weight:650;letter-spacing:.3px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.logo{font-weight:800;font-size:25px}.logo span{color:#287e78}.circle{background:white;border:1px solid #edf0f5;border-radius:16px;width:46px;height:46px;display:grid;place-items:center;font-size:21px}.monthbar{background:#fff;border:1px solid #edf0f5;box-shadow:0 8px 28px #26344c07;border-radius:23px;padding:17px;display:flex;justify-content:space-between;align-items:center;text-align:center}.monthbar button{border:0;background:#f2f5f8;border-radius:13px;width:42px;height:42px;font-size:25px;color:#277d77}.monthbar strong{font-size:21px}.status{font-size:12px;color:#20836b;margin-top:5px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:24px 1px 12px}.sectionhead h2{font-size:17px;margin:0}.sectionhead small{color:#8993a2}.cards{display:grid;grid-template-columns:1fr 1fr;gap:11px}.card{background:#fff;border:1px solid #edf0f5;border-radius:20px;padding:17px 15px;min-height:124px}.card .symbol{font-size:21px;display:block;margin-bottom:12px}.card .label{font-size:13px;color:#8490a0}.card .value{font-size:21px;font-weight:800;margin-top:7px;white-space:nowrap}.card.highlight{background:#173c40;color:#fff;border-color:#173c40}.card.highlight .label{color:#c0d5d4}.card .value small,.totalvalue small{font-size:12px;font-weight:500}.add{display:block;width:100%;margin:18px 0 12px;border:0;border-radius:18px;background:#27857a;color:#fff;padding:18px;font-size:17px;font-weight:750;box-shadow:0 8px 18px #27857a2b}.drawer{background:#fff;border:1px solid #e8edf2;border-radius:19px;overflow:hidden}.drawerBtn{width:100%;display:flex;align-items:center;gap:12px;padding:18px;border:0;background:#fff;text-align:right;color:#19243a}.drawerIcon{width:43px;height:43px;background:#eaf4f1;color:#238273;border-radius:14px;display:grid;place-items:center;font-size:23px}.drawerTitle{flex:1;font-size:16px;font-weight:750}.drawerTitle small{display:block;font-weight:400;color:#8892a0;font-size:12px;margin-top:3px}.chevron{font-size:22px;color:#8993a2;transition:transform .2s}.drawer.open .chevron{transform:rotate(90deg)}.expenses{display:none;border-top:1px solid #edf0f5;padding:9px 14px 15px}.drawer.open .expenses{display:block}.item{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid #f0f2f5}.item:last-child{border:0}.itemName{flex:1;font-size:14px;font-weight:700}.itemName small{display:block;font-size:11px;font-weight:400;color:#8b94a1;margin-top:4px}.itemMoney{text-align:left;font-weight:750;white-space:nowrap}.delete{border:0;background:#fff1f0;color:#b44c49;border-radius:9px;padding:7px;font-size:11px;margin-top:5px}.footerTotal{margin-top:15px;border-radius:20px;background:#eaf1f2;padding:18px;display:flex;align-items:center;justify-content:space-between}.footerTotal span{font-size:14px;color:#526e73}.totalvalue{font-size:22px;font-weight:850;color:#164a4a}.close{width:100%;margin-top:15px;border:1px solid #cddbd7;background:transparent;border-radius:16px;padding:16px;font-size:15px;color:#287d72;font-weight:750}.note{color:#986c27;font-size:12px;margin-top:12px}.form{display:none;background:#fff;padding:18px;border-radius:20px;margin:12px 0;border:1px solid #edf0f5}.form.show{display:block}.form h3{margin:0 0 12px}.form label{display:block;font-size:13px;margin:13px 0 6px;color:#526173}.form input,.form select{width:100%;padding:12px;border:1px solid #dce2e9;border-radius:12px;font:inherit;background:#fff;min-height:44px}.check{display:flex;align-items:center;gap:8px;margin-top:14px}.check input{width:20px;min-height:20px}.check label{margin:0}.hidden{display:none}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;padding:13px;border:0;border-radius:12px;font:inherit}.save{background:#27857a;color:#fff}.cancel{background:#f1f3f6}.error{color:#b44c49;font-size:12px;margin-top:7px}@media(max-width:355px){.card .value{font-size:17px}.app{padding-left:12px;padding-right:12px}}
</style></head><body><main class="app">
<header class="top"><div><div class="eyebrow">مساحتك المالية الخاصة</div><div class="logo">مصاريف<span>ي</span></div></div><div class="circle">◈</div></header>
<section class="monthbar"><button id="prev" aria-label="الشهر السابق">›</button><div><strong id="month"></strong><div class="status" id="monthStatus"></div></div><button id="next" aria-label="الشهر التالي">‹</button></section>
<div class="sectionhead"><h2>نظرة عامة</h2><small>ملخص هذا الشهر</small></div>
<div class="cards"><div class="card highlight"><span class="symbol">◫</span><div class="label">إجمالي المصاريف</div><div class="value" id="total"></div></div><div class="card"><span class="symbol">✓</span><div class="label">تم دفعه</div><div class="value" id="paid"></div></div><div class="card"><span class="symbol">◷</span><div class="label">متبقي للدفع</div><div class="value" id="remaining"></div></div><div class="card"><span class="symbol">↙</span><div class="label">لي عند الآخرين</div><div class="value" id="due"></div></div></div>
<button class="add" id="add">＋ إضافة عملية جديدة</button>
<form id="form" class="form"><h3>إضافة عملية</h3><label>اسم العملية</label><input id="title" required placeholder="مثل: فاتورة الكهرباء"><label>المبلغ (ريال)</label><input id="amount" type="number" min=".01" step=".01" required inputmode="decimal"><label>التاريخ</label><input id="date" type="date" required><label>حالة الدفع</label><select id="status"><option value="paid">مدفوع</option><option value="unpaid">غير مدفوع</option><option value="partial">مدفوع جزئيًا</option></select><div id="partial" class="hidden"><label>المبلغ المدفوع</label><input id="paidAmount" type="number" min="0" step=".01" inputmode="decimal"></div><div class="check"><input type="checkbox" id="receivable"><label for="receivable">دفعت عن شخص وأطلبه منه</label></div><div id="personBox" class="hidden"><label>اسم الشخص</label><input id="person"><label>المبلغ الذي أعاده لك</label><input id="received" type="number" min="0" step=".01" value="0" inputmode="decimal"></div><div id="err" class="error"></div><div class="actions"><button type="submit" class="save">حفظ العملية</button><button type="button" class="cancel" id="cancel">إلغاء</button></div></form>
<div class="sectionhead"><h2>التفاصيل</h2></div>
<section class="drawer" id="drawer"><button class="drawerBtn" id="toggle" aria-expanded="false"><span class="drawerIcon">▤</span><span class="drawerTitle">مصاريف الشهر<small id="count">0 عمليات مسجلة</small></span><span class="chevron">‹</span></button><div class="expenses" id="expenses"></div></section>
<section class="footerTotal"><span id="totalLabel">مجموع مصاريف الشهر</span><div class="totalvalue" id="footerTotal"></div></section>
<button class="close" id="close">✓ تم سداد متطلبات هذا الشهر</button><div id="note" class="note"></div>
</main><script>
const $=s=>document.getElementById(s),months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];let today=new Date(),y=today.getFullYear(),m=today.getMonth();
let data=[],closed=new Set();try{data=JSON.parse(localStorage.getItem('masarifi-data')||'[]');closed=new Set(JSON.parse(localStorage.getItem('masarifi-closed')||'[]'))}catch(e){alert('تعذر قراءة البيانات المحفوظة. لم يتم حذفها.')}
const key=()=>y+'-'+m,fmt=n=>new Intl.NumberFormat('ar-SA',{maximumFractionDigits:2}).format(n),cash=n=>fmt(n)+' <small>ر.س</small>';
function save(){localStorage.setItem('masarifi-data',JSON.stringify(data));localStorage.setItem('masarifi-closed',JSON.stringify([...closed]))}
function render(){const rows=data.filter(x=>x.y===y&&x.m===m),total=rows.reduce((s,x)=>s+x.amount,0),paid=rows.reduce((s,x)=>s+x.paid,0),due=rows.reduce((s,x)=>s+(x.receivable?Math.max(0,x.amount-x.received):0),0);
$('month').textContent=months[m]+' '+y;$('monthStatus').textContent=closed.has(key())?'● تم إقفال الشهر':'● الشهر مفتوح';$('total').innerHTML=cash(total);$('paid').innerHTML=cash(paid);$('remaining').innerHTML=cash(Math.max(0,total-paid));$('due').innerHTML=cash(due);$('footerTotal').innerHTML=cash(total);$('totalLabel').textContent='مجموع مصاريف '+months[m];$('count').textContent=rows.length+' '+(rows.length===1?'عملية مسجلة':'عمليات مسجلة');$('close').textContent=closed.has(key())?'✓ تم إقفال هذا الشهر (اضغط لإعادة الفتح)':'✓ تم سداد متطلبات هذا الشهر';
$('expenses').replaceChildren();if(!rows.length){let empty=document.createElement('p');empty.className='muted';empty.textContent='ما أضفت أي مصاريف لهذا الشهر بعد.';$('expenses').append(empty)}
rows.slice().reverse().forEach(x=>{let row=document.createElement('div');row.className='item';let name=document.createElement('div');name.className='itemName';name.textContent=x.title;let detail=document.createElement('small');detail.textContent=(x.status==='paid'?'مدفوع':x.status==='unpaid'?'غير مدفوع':'مدفوع جزئيًا')+(x.receivable?' · '+(x.person||'مبلغ عند شخص')+' · باقي '+fmt(Math.max(0,x.amount-x.received))+' ر.س':'');name.append(detail);let right=document.createElement('div');right.className='itemMoney';right.textContent=fmt(x.amount)+' ر.س';let del=document.createElement('button');del.className='delete';del.textContent='حذف';del.onclick=()=>{if(confirm('حذف هذه العملية؟')){data=data.filter(z=>z.id!==x.id);save();render()}};right.append(document.createElement('br'),del);row.append(name,right);$('expenses').append(row)});
let opens=[...new Set(data.map(x=>x.y+'-'+x.m))].filter(k=>!closed.has(k)&&k!==key());$('note').textContent=opens.length?'لديك '+opens.length+' شهر/أشهر أخرى ما زالت مفتوحة.':''}
$('prev').onclick=()=>{if(--m<0){m=11;y--}render()};$('next').onclick=()=>{if(++m>11){m=0;y++}render()};
$('toggle').onclick=()=>{let open=$('drawer').classList.toggle('open');$('toggle').setAttribute('aria-expanded',open)};
$('add').onclick=()=>{$('form').classList.toggle('show');let d=new Date(y,m,Math.min(today.getDate(),new Date(y,m+1,0).getDate()));$('date').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if($('form').classList.contains('show'))$('title').focus()};
$('cancel').onclick=()=>$('form').classList.remove('show');$('status').onchange=()=>$('partial').classList.toggle('hidden',$('status').value!=='partial');$('receivable').onchange=()=>$('personBox').classList.toggle('hidden',!$('receivable').checked);
$('form').onsubmit=e=>{e.preventDefault();let amount=Number($('amount').value),status=$('status').value,paid=status==='paid'?amount:status==='unpaid'?0:Number($('paidAmount').value||0),received=Number($('received').value||0),parts=$('date').value.split('-').map(Number);if(!amount||amount<=0||paid<0||paid>amount||received<0||received>amount||!$('title').value.trim()||($('receivable').checked&&!$('person').value.trim())){$('err').textContent='تأكد من اسم العملية والمبالغ واسم الشخص إن وجد.';return}data.push({id:Date.now()+Math.random(),title:$('title').value.trim(),amount,paid,status,receivable:$('receivable').checked,person:$('person').value.trim(),received,y:parts[0],m:parts[1]-1});save();$('form').reset();$('form').classList.remove('show');$('partial').classList.add('hidden');$('personBox').classList.add('hidden');$('err').textContent='';render()};
$('close').onclick=()=>{if(!closed.has(key())){let rows=data.filter(x=>x.y===y&&x.m===m);if(rows.some(x=>x.paid<x.amount||x.receivable&&x.received<x.amount)&&!confirm('توجد مبالغ لم تُسدد بالكامل. هل تريد إقفال الشهر رغم ذلك؟'))return;closed.add(key())}else closed.delete(key());save();render()};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
