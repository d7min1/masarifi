<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مصاريفي">
<link rel="manifest" href="./manifest.webmanifest">
<title>مصاريفي</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#18181b;font-family:-apple-system,BlinkMacSystemFont,"SF Arabic",Arial,sans-serif}.app{max-width:620px;margin:auto;padding:18px}.head{display:flex;align-items:center;justify-content:space-between}.nav,.btn{min-height:46px;border:0;border-radius:14px;background:#fff;padding:0 16px;font-size:16px}.month{text-align:center}.month b{font-size:22px}.muted{font-size:13px;color:#71717a}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.card,.row,.form{background:#fff;border-radius:18px;padding:14px}.card small{color:#71717a}.card strong{display:block;font-size:18px;margin-top:5px}.primary{width:100%;background:#18181b;color:#fff;font-weight:700}.form{display:none;margin:12px 0}.form.open{display:block}label{display:block;font-size:13px;margin:11px 0 5px}input,select{width:100%;min-height:46px;border:1px solid #d4d4d8;border-radius:12px;padding:8px 12px;font-size:16px;background:#fff}.check{display:flex;gap:9px;align-items:center;margin-top:12px}.check input{width:22px;min-height:22px}.check label{margin:0}.hidden{display:none}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}.list{display:grid;gap:9px;margin-top:14px}.row{display:flex;justify-content:space-between;gap:12px}.row h3{font-size:16px;margin:0 0 5px}.money{font-weight:700;white-space:nowrap}.del{border:0;background:none;color:#71717a;min-height:42px}.close{width:100%;margin-top:18px;border:1px solid #d4d4d8}.notice{font-size:13px;color:#8a5a00;margin-top:12px}
</style>
</head>
<body><main class="app">
<div class="head"><button class="nav" id="prev">‹</button><div class="month"><b id="month"></b><div id="state" class="muted"></div></div><button class="nav" id="next">›</button></div>
<div class="cards"><div class="card"><small>إجمالي الشهر</small><strong id="total">0 ر.س</strong></div><div class="card"><small>تم دفعه</small><strong id="paid">0 ر.س</strong></div><div class="card"><small>متبقي للدفع</small><strong id="unpaid">0 ر.س</strong></div><div class="card"><small>لي عند الآخرين</small><strong id="due">0 ر.س</strong></div></div>
<button class="btn primary" id="add">＋ إضافة عملية</button>
<form class="form" id="form"><label>اسم العملية</label><input id="title" required placeholder="مثال: فاتورة الكهرباء"><label>المبلغ</label><input id="amount" required type="number" min=".01" step=".01" inputmode="decimal"><label>التاريخ</label><input id="date" required type="date"><label>حالة الدفع</label><select id="status"><option value="paid">مدفوع</option><option value="unpaid">غير مدفوع</option><option value="partial">مدفوع جزئيًا</option></select><div id="partial" class="hidden"><label>المبلغ المدفوع</label><input id="paidAmount" type="number" min="0" step=".01"></div><div class="check"><input id="receivable" type="checkbox"><label for="receivable">دفعت المبلغ عن شخص وأطلبه منه</label></div><div id="personBox" class="hidden"><label>اسم الشخص</label><input id="person"><label>كم سدّد لك؟</label><input id="received" type="number" min="0" step=".01" value="0"></div><div id="err" class="notice"></div><div class="actions"><button class="btn primary" type="submit">حفظ</button><button class="btn" id="cancel" type="button">إلغاء</button></div></form>
<div id="notice" class="notice"></div><div id="list" class="list"></div><button class="btn close" id="close">✓ تم سداد متطلبات هذا الشهر</button>
</main>
<script>
const $=i=>document.getElementById(i),months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
let d=new Date(),y=d.getFullYear(),m=d.getMonth(),data=JSON.parse(localStorage.getItem('masarifi-data')||'[]'),closed=new Set(JSON.parse(localStorage.getItem('masarifi-closed')||'[]'));
const key=()=>y+'-'+m,save=()=>{localStorage.setItem('masarifi-data',JSON.stringify(data));localStorage.setItem('masarifi-closed',JSON.stringify([...closed]))},money=n=>new Intl.NumberFormat('ar-SA',{maximumFractionDigits:2}).format(n)+' ر.س';
function render(){let rows=data.filter(x=>x.y===y&&x.m===m),total=rows.reduce((s,x)=>s+x.amount,0),paid=rows.reduce((s,x)=>s+x.paid,0),due=rows.reduce((s,x)=>s+(x.receivable?Math.max(0,x.amount-x.received):0),0);$('month').textContent=months[m]+' '+new Intl.NumberFormat('ar-SA',{useGrouping:false}).format(y);$('state').textContent=closed.has(key())?'تم إقفال الشهر':'الشهر مفتوح';$('total').textContent=money(total);$('paid').textContent=money(paid);$('unpaid').textContent=money(Math.max(0,total-paid));$('due').textContent=money(due);$('close').textContent=closed.has(key())?'✓ تم إقفال متطلبات هذا الشهر':'✓ تم سداد متطلبات هذا الشهر';$('list').innerHTML='';rows.slice().reverse().forEach(x=>{let r=document.createElement('div');r.className='row';let a=document.createElement('div'),h=document.createElement('h3'),s=document.createElement('div');h.textContent=x.title;s.className='muted';s.textContent=(x.status==='paid'?'مدفوع':x.status==='unpaid'?'غير مدفوع':'مدفوع جزئيًا')+(x.receivable&&x.person?' • على '+x.person:'');a.append(h,s);if(x.receivable){let q=document.createElement('div');q.className='muted';q.textContent='باقي لك '+money(Math.max(0,x.amount-x.received));a.append(q)}let b=document.createElement('div'),v=document.createElement('div'),del=document.createElement('button');v.className='money';v.textContent=money(x.amount);del.className='del';del.textContent='حذف';del.onclick=()=>{data=data.filter(z=>z.id!==x.id);save();render()};b.append(v,del);r.append(a,b);$('list').append(r)});let opens=[...new Set(data.map(x=>x.y+'-'+x.m))].filter(k=>!closed.has(k)&&k!==key());$('notice').textContent=opens.length?'تنبيه: لديك '+opens.length+' شهر/أشهر سابقة ما زالت مفتوحة.':''}
function shift(n){m+=n;if(m<0){m=11;y--}if(m>11){m=0;y++}render()}
$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);$('add').onclick=()=>{$('form').classList.add('open');$('date').value=new Date().toLocaleDateString('en-CA')};$('cancel').onclick=()=>$('form').classList.remove('open');$('status').onchange=()=>$('partial').classList.toggle('hidden',$('status').value!=='partial');$('receivable').onchange=()=>$('personBox').classList.toggle('hidden',!$('receivable').checked);
$('form').onsubmit=e=>{e.preventDefault();let amount=Number($('amount').value),status=$('status').value,paid=status==='paid'?amount:status==='unpaid'?0:Number($('paidAmount').value||0),received=Number($('received').value||0),p=$('date').value.split('-').map(Number);if(!amount||paid<0||paid>amount||received<0||received>amount){$('err').textContent='راجع المبالغ المدخلة.';return}data.push({id:Date.now()+Math.random(),title:$('title').value.trim(),amount,paid,status,receivable:$('receivable').checked,person:$('person').value.trim(),received,y:p[0],m:p[1]-1});save();e.target.reset();$('partial').classList.add('hidden');$('personBox').classList.add('hidden');$('form').classList.remove('open');$('err').textContent='';render()};
$('close').onclick=()=>{closed.has(key())?closed.delete(key()):closed.add(key());save();render()};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
