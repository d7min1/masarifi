<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0F5132"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="مصاريفي"><link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.webmanifest"><title>مصاريفي</title><style>
*{box-sizing:border-box}body{margin:0;background:#F8F6F1;color:#17221c;font-family:-apple-system,BlinkMacSystemFont,"SF Arabic",Arial;padding-bottom:80px}.app{max-width:620px;margin:auto;padding:18px}.brand{display:flex;align-items:center;gap:10px;justify-content:center;color:#0F5132}.logo{width:48px;height:48px;border-radius:15px;background:#0F5132;position:relative}.logo:before{content:"م";color:#F8F6F1;font-size:30px;font-weight:900;position:absolute;right:10px;bottom:4px}.logo:after{content:"";width:25px;height:8px;background:#C9A96B;position:absolute;right:9px;top:8px;border-radius:8px;transform:rotate(-12deg)}h1{font-size:23px}.month{display:flex;justify-content:center;align-items:center;gap:20px;margin:8px}.month button{border:0;background:none;font-size:26px;color:#0F5132}.state{text-align:center;color:#16865d;font-size:11px;margin-bottom:12px}.hero{background:linear-gradient(145deg,#176844,#0b452e);color:#fff;border-radius:23px;padding:20px;box-shadow:0 12px 28px #0f51321c}.hero strong{display:block;font-size:38px;margin-top:8px}.hero small,.num small{font-size:10px;font-weight:500}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.card{background:#fff;border:1px solid #eeeae1;border-radius:18px;padding:13px 6px;text-align:center}.card i{font-style:normal;width:33px;height:33px;border-radius:50%;display:grid;place-items:center;margin:auto auto 7px;background:#eaf4ef;color:#16865d}.card:nth-child(2)i{background:#fff0e4;color:#d67828}.card:nth-child(3)i{background:#eaf1fb;color:#3974b8}.lbl{font-size:10px;color:#777}.num{font-size:16px;font-weight:800;margin-top:5px}.add{width:100%;border:0;border-radius:16px;background:#0F6A47;color:#fff;padding:16px;margin:13px 0;font-size:16px;font-weight:750}.form{display:none;background:#fff;border-radius:18px;padding:15px;margin-bottom:12px}.form.show{display:block}label{display:block;font-size:11px;color:#666;margin:10px 0 5px}input,select{width:100%;min-height:44px;border:1px solid #ddd;border-radius:11px;padding:8px;font:inherit}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;gap:7px;align-items:center;margin-top:12px}.check input{width:20px;min-height:20px}.check label{margin:0}.hidden{display:none}.actions{display:flex;gap:8px;margin-top:13px}.actions button{flex:1;border:0;border-radius:11px;padding:12px}.save{background:#0F5132;color:#fff}.drawer{background:#fff;border:1px solid #ebe8e0;border-radius:18px;overflow:hidden}.drawerHead{width:100%;border:0;background:#fff;padding:15px;display:flex;align-items:center;text-align:right}.drawerHead b{flex:1}.drawerHead small{display:block;color:#888;font-weight:400;margin-top:3px}.list{display:none;border-top:1px solid #eee;padding:5px 13px}.drawer.open .list{display:block}.item{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid #f1eee8}.item:last-child{border:0}.cat{width:35px;height:35px;border-radius:10px;background:#f3efe5;display:grid;place-items:center}.name{flex:1;font-size:13px;font-weight:700}.name small{display:block;color:#888;font-size:9px;font-weight:400;margin-top:3px}.amt{text-align:left;font-weight:800;font-size:12px}.del{border:0;background:#fff0ed;color:#a94b43;border-radius:7px;font-size:9px;margin-top:4px}.total{display:flex;justify-content:space-between;background:#EDE7D9;border-radius:17px;padding:15px;margin-top:11px}.total strong{color:#0F5132;font-size:20px}.close{width:100%;border:1px solid #9dc4b3;background:#fff;color:#0F5132;border-radius:15px;padding:14px;margin-top:11px;font-weight:700}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffdf9f2;border-top:1px solid #e8e4db;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}.tab{border:0;background:none;color:#888;font-size:10px}.tab b{display:block;font-size:19px}.tab.active{color:#0F5132;font-weight:800}.panel{display:none}.panel.active{display:block}.pageTitle{font-size:22px}.box{background:#fff;border:1px solid #ebe8e0;border-radius:17px;padding:15px;margin-bottom:9px}.person{display:flex;justify-content:space-between}.error{font-size:10px;color:#b44c49}.note{font-size:10px;color:#92712f;margin-top:8px}
</style></head><body><main class="app"><div class="brand"><div class="logo"></div><h1>مصاريفي</h1></div>
<section id="home" class="panel active"><div class="month"><button id="prev">›</button><b id="month"></b><button id="next">‹</button></div><div id="state" class="state"></div><div class="hero">إجمالي مصاريف الشهر<strong id="total"></strong></div><div class="cards"><div class="card"><i>✓</i><div class="lbl">تم دفعه</div><div class="num" id="paid"></div></div><div class="card"><i>◷</i><div class="lbl">متبقي للدفع</div><div class="num" id="remain"></div></div><div class="card"><i>♟</i><div class="lbl">لي عند الآخرين</div><div class="num" id="due"></div></div></div><button id="add" class="add">＋ إضافة عملية جديدة</button>
<form id="form" class="form"><b>إضافة عملية</b><label>اسم العملية</label><input id="title" required><div class="two"><div><label>المبلغ</label><input id="amount" type="number" min=".01" step=".01" required></div><div><label>التاريخ</label><input id="date" type="date" required></div></div><div class="two"><div><label>التصنيف</label><select id="category"><option>فواتير</option><option>منزل</option><option>سيارة</option><option>أكل</option><option>مشتريات</option><option>اشتراكات</option><option>أخرى</option></select></div><div><label>حالة الدفع</label><select id="status"><option value="paid">مدفوع</option><option value="unpaid">غير مدفوع</option><option value="partial">مدفوع جزئيًا</option></select></div></div><div id="partial" class="hidden"><label>المبلغ المدفوع</label><input id="paidAmount" type="number" min="0" step=".01"></div><div class="check"><input id="rec" type="checkbox"><label>دفعت عن شخص وأطلبه منه</label></div><div id="personBox" class="hidden"><label>اسم الشخص</label><input id="person"><label>كم أعاد لك؟</label><input id="received" type="number" min="0" step=".01" value="0"></div><div id="err" class="error"></div><div class="actions"><button class="save">حفظ</button><button type="button" id="cancel">إلغاء</button></div></form>
<div id="drawer" class="drawer"><button id="toggle" class="drawerHead"><b>مصاريف الشهر<small id="count"></small></b><span>‹</span></button><div id="list" class="list"></div></div><div class="total"><span id="totalLabel"></span><strong id="footer"></strong></div><button id="close" class="close"></button><div id="note" class="note"></div></section>
<section id="expenses" class="panel"><h2 class="pageTitle">المصاريف</h2><div id="all"></div></section><section id="people" class="panel"><h2 class="pageTitle">الأشخاص</h2><div id="persons"></div></section><section id="reports" class="panel"><h2 class="pageTitle">التقارير</h2><div class="box">إجمالي المصاريف المسجلة<h2 id="grand"></h2></div><div class="box">إجمالي ما تبقى لك عند الآخرين<h2 id="grandDue"></h2></div></section></main>
<nav class="bottom"><button class="tab active" data-p="home"><b>⌂</b>الرئيسية</button><button class="tab" data-p="expenses"><b>▤</b>المصاريف</button><button class="tab" data-p="people"><b>♧</b>الأشخاص</button><button class="tab" data-p="reports"><b>◔</b>التقارير</button></nav>
<script>
const $=i=>document.getElementById(i),months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'],icons={فواتير:'⚡',منزل:'⌂',سيارة:'▣',أكل:'♨',مشتريات:'▱',اشتراكات:'▭',أخرى:'•••'};let now=new Date(),y=now.getFullYear(),m=now.getMonth(),data=[],closed=new Set();try{data=JSON.parse(localStorage.getItem('masarifi-data')||'[]');closed=new Set(JSON.parse(localStorage.getItem('masarifi-closed')||'[]'))}catch(e){}data=data.map(x=>({...x,category:x.category||'أخرى',amount:+x.amount||0,paid:+x.paid||0,received:+x.received||0}));const key=()=>y+'-'+m,fmt=n=>new Intl.NumberFormat('ar-SA',{maximumFractionDigits:2}).format(n),cash=n=>fmt(n)+' <small>ر.س</small>';function save(){localStorage.setItem('masarifi-data',JSON.stringify(data));localStorage.setItem('masarifi-closed',JSON.stringify([...closed]))}
function node(x,del=true){let r=document.createElement('div');r.className='item';let c=document.createElement('div');c.className='cat';c.textContent=icons[x.category]||'•••';let n=document.createElement('div');n.className='name';n.textContent=x.title;let s=document.createElement('small');s.textContent=x.category+' · '+(x.status==='paid'?'تم الدفع':x.status==='partial'?'مدفوع جزئيًا':'متبقي')+(x.receivable&&x.person?' · على '+x.person:'');n.append(s);let a=document.createElement('div');a.className='amt';a.textContent=fmt(x.amount)+' ر.س';if(del){let b=document.createElement('button');b.className='del';b.textContent='حذف';b.onclick=()=>{if(confirm('حذف العملية؟')){data=data.filter(z=>z.id!==x.id);save();render()}};a.append(document.createElement('br'),b)}r.append(c,n,a);return r}
function render(){let rows=data.filter(x=>x.y===y&&x.m===m),t=rows.reduce((s,x)=>s+x.amount,0),p=rows.reduce((s,x)=>s+x.paid,0),d=rows.reduce((s,x)=>s+(x.receivable?Math.max(0,x.amount-x.received):0),0);$('month').textContent=months[m]+' '+y;$('state').textContent=closed.has(key())?'● تم إقفال الشهر':'● الشهر مفتوح';$('total').innerHTML=cash(t);$('paid').innerHTML=cash(p);$('remain').innerHTML=cash(Math.max(0,t-p));$('due').innerHTML=cash(d);$('footer').innerHTML=cash(t);$('totalLabel').textContent='مجموع مصاريف '+months[m];$('count').textContent=rows.length+' عمليات مسجلة';$('close').textContent=closed.has(key())?'✓ تم إقفال الشهر (اضغط لإعادة الفتح)':'✓ تم سداد متطلبات هذا الشهر';$('list').replaceChildren();if(!rows.length)$('list').innerHTML='<div class="box">لا توجد مصاريف لهذا الشهر.</div>';rows.slice().reverse().forEach(x=>$('list').append(node(x)));$('all').replaceChildren();if(!data.length)$('all').innerHTML='<div class="box">لا توجد عمليات بعد.</div>';else data.slice().reverse().forEach(x=>$('all').append(node(x,false)));let ps={};data.filter(x=>x.receivable).forEach(x=>{let k=x.person||'غير محدد';ps[k]=(ps[k]||0)+Math.max(0,x.amount-x.received)});$('persons').replaceChildren();let pe=Object.entries(ps).filter(x=>x[1]>0);if(!pe.length)$('persons').innerHTML='<div class="box">لا توجد مبالغ مستحقة لك.</div>';pe.forEach(([n,a])=>{let b=document.createElement('div');b.className='box person';b.innerHTML='<b></b><strong></strong>';b.children[0].textContent=n;b.children[1].textContent=fmt(a)+' ر.س';$('persons').append(b)});$('grand').textContent=fmt(data.reduce((s,x)=>s+x.amount,0))+' ر.س';$('grandDue').textContent=fmt(data.reduce((s,x)=>s+(x.receivable?Math.max(0,x.amount-x.received):0),0))+' ر.س';let o=[...new Set(data.map(x=>x.y+'-'+x.m))].filter(k=>!closed.has(k)&&k!==key());$('note').textContent=o.length?'لديك '+o.length+' شهر/أشهر أخرى ما زالت مفتوحة.':''}
$('prev').onclick=()=>{if(--m<0){m=11;y--}render()};$('next').onclick=()=>{if(++m>11){m=0;y++}render()};$('toggle').onclick=()=>$('drawer').classList.toggle('open');$('add').onclick=()=>{$('form').classList.toggle('show');let d=new Date(y,m,Math.min(now.getDate(),new Date(y,m+1,0).getDate()));$('date').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};$('cancel').onclick=()=>$('form').classList.remove('show');$('status').onchange=()=>$('partial').classList.toggle('hidden',$('status').value!=='partial');$('rec').onchange=()=>$('personBox').classList.toggle('hidden',!$('rec').checked);$('form').onsubmit=e=>{e.preventDefault();let a=+$('amount').value,s=$('status').value,p=s==='paid'?a:s==='unpaid'?0:+$('paidAmount').value||0,r=+$('received').value||0,dt=$('date').value.split('-').map(Number);if(!a||p>a||r>a||!$('title').value.trim()||($('rec').checked&&!$('person').value.trim())){$('err').textContent='راجع البيانات المدخلة.';return}data.push({id:Date.now()+Math.random(),title:$('title').value.trim(),amount:a,paid:p,status:s,category:$('category').value,receivable:$('rec').checked,person:$('person').value.trim(),received:r,y:dt[0],m:dt[1]-1});save();e.target.reset();$('form').classList.remove('show');$('partial').classList.add('hidden');$('personBox').classList.add('hidden');$('err').textContent='';render()};$('close').onclick=()=>{closed.has(key())?closed.delete(key()):closed.add(key());save();render()};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');$(t.dataset.p).classList.add('active');scrollTo(0,0)});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();
</script></body></html>
